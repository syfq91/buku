[project]
name = "buku"
version = "0.1.0"
description = "Lightweight, self-hosted digital book server"
readme = "README.md"
authors = [
    { name = "syfq91", email = "syfq91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "click>=8.1.7",
    "epubkit>=0.1.0.post202601060842",
    "fastapi>=0.115.0",
    "jinja2>=3.1.6",
    "pillow>=10.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
bookserver = "buku.cli:main"
buku = "buku.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
